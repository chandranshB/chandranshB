name: Sovereign Telemetry

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/**'

permissions:
  contents: write

jobs:
  telemetry:
    name: Refresh Language Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Language Distribution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/generate_metrics.py

      - name: Commit and Push Updated Assets
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          if git diff --staged --quiet; then
            echo "No changes in generated assets."
          else
            git commit -m "chore(telemetry): refresh language distribution [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
